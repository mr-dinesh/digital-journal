<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14110F">
<title>Radio OS</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --chassis:#14110F;
  --panel:#1E1915;
  --panel-2:#241E17;
  --panel-edge:#3A322B;
  --amber:#E8A03C;
  --amber-bright:#F4B860;
  --amber-dim:#8A6224;
  --ink:#F5EDE0;
  --muted:#6E6257;
  --radius:14px;
  --radius-sm:9px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(140% 60% at 50% -10%, rgba(232,160,60,.06), transparent 55%),
    var(--chassis);
  color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif;
  min-height:100vh;
  display:flex;justify-content:center;
  padding:18px 14px calc(120px + env(safe-area-inset-bottom));
}
.rig{width:100%;max-width:820px}
:lang(kn){font-family:'Noto Sans Kannada','Archivo',sans-serif}
:lang(hi){font-family:'Noto Sans Devanagari','Archivo',sans-serif}
::selection{background:rgba(232,160,60,.3)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:4px}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:8px 4px 20px;
}
.brand{display:flex;align-items:center;gap:11px}
.brand .dot{
  width:11px;height:11px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 12px rgba(232,160,60,.7);
}
.wordmark{
  font-family:'Chivo Mono',monospace;font-weight:500;font-size:15px;
  letter-spacing:.30em;color:var(--ink);text-transform:uppercase;white-space:nowrap;
}
.wordmark b{color:var(--amber);font-weight:500}
#clock{
  font-family:'Chivo Mono',monospace;font-size:13px;
  color:var(--muted);letter-spacing:.08em;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}

/* ---------- hero / now-playing ---------- */
.tuner{
  position:relative;
  background:linear-gradient(180deg,var(--panel-2) 0%,#1B1611 100%);
  border:1px solid var(--panel-edge);border-radius:var(--radius);
  padding:26px 26px 22px;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(245,237,224,.05), 0 18px 40px rgba(0,0,0,.5);
}
.tuner::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 0%, rgba(232,160,60,.10), transparent 60%)}
.tuner::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.10) 3px 4px)}

.station-line{
  display:flex;align-items:center;gap:10px;position:relative;z-index:1;
  font-family:'Chivo Mono',monospace;font-size:11.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--amber);margin-bottom:18px;
}
.beacon{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
.beacon.live{background:var(--amber);box-shadow:0 0 8px rgba(232,160,60,.85);animation:pulse 2.2s ease-in-out infinite}
.beacon.buffering{background:var(--amber-dim);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.badge{
  margin-left:auto;font-size:10px;letter-spacing:.14em;color:var(--muted);
  border:1px solid var(--panel-edge);border-radius:20px;padding:3px 9px;
}

.np{display:flex;gap:22px;align-items:center;position:relative;z-index:1}
.art{
  position:relative;width:104px;height:104px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,#2A231C,#1A1510);border:1px solid var(--panel-edge);
  display:flex;align-items:center;justify-content:center;
  font-family:'Chivo Mono',monospace;font-size:34px;color:var(--amber-dim);
  overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.4);
}
.art img{width:100%;height:100%;object-fit:cover;display:block}
/* equalizer overlay while playing (no artwork) */
.eq{position:absolute;bottom:12px;left:0;right:0;display:none;
  align-items:flex-end;justify-content:center;gap:3px;height:26px}
.art.playing.noart .eq{display:flex}
.eq span{width:3px;background:var(--amber);border-radius:2px;height:30%;animation:bar 1s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:.2s}.eq span:nth-child(3){animation-delay:.4s}
.eq span:nth-child(4){animation-delay:.1s}.eq span:nth-child(5){animation-delay:.3s}
@keyframes bar{0%,100%{height:25%}50%{height:95%}}
@media (prefers-reduced-motion:reduce){.eq span{animation:none;height:55%}}

.meta{min-width:0;flex:1}
#np-title{font-size:clamp(20px,4.6vw,28px);font-weight:700;line-height:1.18;overflow-wrap:anywhere}
#np-artist{font-size:15px;color:var(--amber);margin-top:6px;font-weight:500;overflow-wrap:anywhere}
#np-album{font-family:'Chivo Mono',monospace;font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.04em;overflow-wrap:anywhere}
.fav-hero{
  background:none;border:none;cursor:pointer;color:var(--muted);
  font-size:22px;line-height:1;padding:4px;flex-shrink:0;align-self:flex-start;
  transition:color .2s,transform .1s;
}
.fav-hero:hover{color:var(--amber)}
.fav-hero.on{color:var(--amber)}
.fav-hero:active{transform:scale(.9)}

/* ---------- transport ---------- */
.transport{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:24px;position:relative;z-index:1}
.tbtn{
  border:1px solid var(--panel-edge);background:transparent;color:var(--ink);
  border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .2s,transform .1s,border-color .2s;
}
.tbtn:hover{border-color:var(--amber-dim);background:rgba(232,160,60,.08)}
.tbtn:active{transform:scale(.95)}
.tbtn.side{width:40px;height:40px;font-size:13px;color:var(--muted)}
.tbtn.side:hover{color:var(--amber)}
#play{width:60px;height:60px;border-color:var(--amber-dim);color:var(--amber);font-size:19px}
#play:hover{background:rgba(232,160,60,.14)}
.vol-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:120px}
.vol-label{font-family:'Chivo Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.16em}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;
  background:var(--panel-edge);border-radius:3px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amber);border:none;box-shadow:0 0 0 4px rgba(232,160,60,.12)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--amber);border:none}
#status{font-family:'Chivo Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.1em;white-space:nowrap}

/* ---------- controls: search + chips ---------- */
.controls{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);pointer-events:none}
#search{
  width:100%;background:var(--panel);border:1px solid var(--panel-edge);
  border-radius:var(--radius-sm);color:var(--ink);font-family:'Archivo',sans-serif;
  font-size:15px;padding:13px 14px 13px 40px;transition:border-color .2s;
}
#search::placeholder{color:var(--muted)}
#search:focus{outline:none;border-color:var(--amber-dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;background:var(--panel);border:1px solid var(--panel-edge);
  color:var(--muted);border-radius:20px;padding:8px 15px;cursor:pointer;
  font-family:'Chivo Mono',monospace;font-size:11.5px;letter-spacing:.08em;
  transition:all .18s;display:flex;align-items:center;gap:6px;
}
.chip:hover{border-color:var(--amber-dim);color:var(--ink)}
.chip.active{background:var(--amber);border-color:var(--amber);color:#1B1611;font-weight:500}
.chip .native{font-family:'Noto Sans Kannada','Noto Sans Devanagari',sans-serif}

/* ---------- presets ---------- */
.band{margin-top:26px}
.band-label{
  font-family:'Chivo Mono',monospace;font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px;margin-bottom:13px;
}
.band-label .native{font-family:inherit;letter-spacing:normal;text-transform:none;color:var(--amber-dim);font-size:13px}
.band-label::after{content:"";flex:1;height:1px;background:var(--panel-edge)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px}
.preset{
  position:relative;background:var(--panel);border:1px solid var(--panel-edge);
  border-radius:var(--radius-sm);padding:15px 15px 14px;text-align:left;cursor:pointer;
  color:var(--ink);font-family:'Archivo',sans-serif;overflow:hidden;
  transition:border-color .18s,background .18s,transform .1s;min-height:66px;
}
.preset:hover{border-color:var(--amber-dim);background:#241E18}
.preset:active{transform:scale(.985)}
.preset.active{border-color:var(--amber);background:#2A231B;box-shadow:0 0 0 1px var(--amber-dim) inset}
.preset .p-name{font-size:14.5px;font-weight:600;line-height:1.25;padding-right:22px}
.preset .p-desc{font-family:'Chivo Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.02em}
.preset.active .p-desc{color:var(--amber-dim)}
.p-fav{
  position:absolute;top:10px;right:10px;background:none;border:none;cursor:pointer;
  color:var(--panel-edge);font-size:15px;line-height:1;padding:2px;transition:color .18s,transform .1s;
}
.p-fav:hover{color:var(--amber)}
.p-fav.on{color:var(--amber)}
.p-fav:active{transform:scale(.85)}
/* mini eq badge on the actively-playing card */
.p-eq{position:absolute;bottom:12px;right:12px;display:none;align-items:flex-end;gap:2px;height:12px}
.preset.playing .p-eq{display:flex}
.preset.playing .p-name{color:var(--amber-bright)}
.p-eq span{width:2.5px;background:var(--amber);border-radius:1px;height:40%;animation:bar .9s ease-in-out infinite}
.p-eq span:nth-child(2){animation-delay:.3s}.p-eq span:nth-child(3){animation-delay:.15s}
@media (prefers-reduced-motion:reduce){.p-eq span{animation:none;height:70%}}
.empty{color:var(--muted);font-family:'Chivo Mono',monospace;font-size:13px;text-align:center;padding:40px 0}

/* ---------- sticky mini-player (mobile) ---------- */
.mini{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  transform:translateY(120%);transition:transform .28s cubic-bezier(.2,.7,.3,1);
  background:rgba(26,21,16,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--panel-edge);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;
}
.mini.show{transform:translateY(0)}
.mini .m-art{width:42px;height:42px;border-radius:7px;flex-shrink:0;background:var(--panel-2);
  border:1px solid var(--panel-edge);display:flex;align-items:center;justify-content:center;
  overflow:hidden;font-family:'Chivo Mono',monospace;color:var(--amber-dim)}
.mini .m-art img{width:100%;height:100%;object-fit:cover}
.mini .m-meta{min-width:0;flex:1}
.mini .m-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .m-sub{font-family:'Chivo Mono',monospace;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mini #mplay{width:44px;height:44px;font-size:15px}

footer{margin-top:40px;text-align:center;font-family:'Chivo Mono',monospace;
  font-size:10.5px;color:var(--muted);letter-spacing:.14em;line-height:1.8}
footer a{color:var(--amber-dim);text-decoration:none}
footer kbd{font-family:'Chivo Mono',monospace;background:var(--panel);border:1px solid var(--panel-edge);
  border-radius:4px;padding:1px 6px;color:var(--muted);font-size:10px}

@media (max-width:520px){
  body{padding:14px 12px calc(110px + env(safe-area-inset-bottom))}
  .tuner{padding:22px 18px 20px}
  .np{gap:16px}
  .art{width:78px;height:78px;font-size:26px}
  .fav-hero{align-self:center}
  #status{margin-left:auto}
  .presets{grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:9px}
}
@media (min-width:521px){ .mini{display:none} }
</style>
</head>
<body>
<div class="rig">
  <header>
    <div class="brand"><span class="dot"></span><span class="wordmark">Radio<b>OS</b></span></div>
    <div id="clock">--:--</div>
  </header>

  <section class="tuner" aria-live="polite">
    <div class="station-line">
      <span class="beacon" id="beacon"></span>
      <span id="station-name">Select a station</span>
      <span class="badge" id="badge">STANDBY</span>
    </div>
    <div class="np">
      <div class="art" id="art">
        <span id="art-glyph">&#9679;</span>
        <span class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
      </div>
      <div class="meta">
        <div id="np-title">Standing by</div>
        <div id="np-artist"></div>
        <div id="np-album"></div>
      </div>
      <button class="fav-hero" id="fav-hero" aria-label="Add to favorites" title="Favorite">&#9734;</button>
    </div>
    <div class="transport">
      <button class="tbtn side" id="prev" aria-label="Previous station">&#9664;&#9664;</button>
      <button class="tbtn" id="play" aria-label="Play">&#9654;</button>
      <button class="tbtn side" id="next" aria-label="Next station">&#9654;&#9654;</button>
      <div class="vol-wrap">
        <span class="vol-label">VOL</span>
        <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
      </div>
      <span id="status"></span>
    </div>
  </section>

  <div class="controls">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="search" placeholder="Search stations…" autocomplete="off" spellcheck="false" aria-label="Search stations">
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="bands"></div>

  <footer>
    ಕನ್ನಡ + हिन्दी via All India Radio &middot; RadioParadise &middot; SomaFM<br>
    <kbd>space</kbd> play &middot; <kbd>&larr;</kbd><kbd>&rarr;</kbd> station &middot; <kbd>&uarr;</kbd><kbd>&darr;</kbd> volume<br>
    <a href="https://mrdee.in" rel="noopener">mrdee.in</a>
  </footer>
</div>

<!-- sticky mini player (mobile) -->
<div class="mini" id="mini">
  <div class="m-art" id="m-art">&#9679;</div>
  <div class="m-meta"><div class="m-title" id="m-title">—</div><div class="m-sub" id="m-sub"></div></div>
  <button class="tbtn" id="mplay" aria-label="Play">&#9654;</button>
</div>

<audio id="audio" preload="none"></audio>

<script src="radio.js"></script>
</body>
</html>
